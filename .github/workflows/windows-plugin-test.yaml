name: Windows run Linux container

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check WSL
        run: wsl --status

      - name: Run command in WSL (Ubuntu)
        run: |
          wsl -d -- bash -c "echo 'Hello from WSL2'; ls -la"

      - name: Run your script
        run: |
          wsl -d -- bash -c "your-command-here"