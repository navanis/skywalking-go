name: Setup Docker with WSL2 on Windows-2025

on:
  push:
  workflow_dispatch:

jobs:
  setup-docker:
    runs-on: windows-2025

    steps:
      - name: Remove system Docker (Docker CE)
        shell: powershell
        run: |
          $dockerPath = "C:\Windows\system32\docker.exe"
          if (Test-Path $dockerPath) {
              Rename-Item -Path $dockerPath -NewName "docker.exe.bak"
              Write-Host "System Docker renamed to docker.exe.bak"
          } else {
              Write-Host "No system Docker found"
          }

      - name: Install and Configure WSL 2
        shell: pwsh
        run: |
            Enable-WindowsOptionalFeature -Online -FeatureName Microsoft-Windows-Subsystem-Linux
            Enable-WindowsOptionalFeature -Online -FeatureName VirtualMachinePlatform
            
            wsl --set-default-version 2
            wsl --update
            
            $distros = (Invoke-RestMethod -Uri https://raw.githubusercontent.com/microsoft/WSL/refs/heads/master/distributions/DistributionInfo.json).Distributions
            $distroDownloadUrl = $distros.Where({ $_.Name -eq 'Ubuntu' }).Amd64PackageUrl
            Set-Location $env:GITHUB_WORKSPACE\..\.. 
            $filename = "Ubuntu$([System.IO.Path]::GetExtension($distroDownloadUrl))"
            Invoke-WebRequest -Uri $distroDownloadUrl -OutFile $filename
            Expand-Archive -Path $filename -DestinationPath .\
            $distroExe = (Get-ChildItem -Path . -Filter *.exe).Where({ $_.Name -notmatch 'splash|setup' }).FullName
            & $distroExe install --root
            
            @'
            @echo off
            FOR /F "usebackq tokens=*" %%F IN (`wsl wslpath '%~1'`) DO SET wslpath=%%F
            wsl -d Ubuntu sed -i 's/\r$//' %wslpath%
            wsl -d Ubuntu --cd %GITHUB_WORKSPACE% bash --noprofile --norc -eo pipefail %wslpath%
            '@ | Out-File -FilePath $env:RUNNER_TEMP\wsl-run.bat -Encoding utf8
            $env:RUNNER_TEMP >> $env:GITHUB_PATH

      - name: Download Docker Desktop Installer
        run: |
          curl.exe -L -o docker-desktop.exe "https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe"

      - name: Install Docker Desktop silently (with WSL backend)
        run: |
          ./docker-desktop.exe install --quiet --backend=wsl-2 --install-location "C:\Program Files\Docker"      
          Start-Sleep -Seconds 120

      - name: Start Docker Desktop
        run: |
          "& 'C:/Program Files/Docker/Docker/Docker Desktop.exe'"
        shell: powershell

      - name: Override PATH to use Docker Desktop's docker
        shell: powershell
        run: |
          $dd = "C:/Program Files/Docker/Docker/resources/bin"
          echo "$dd" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check docker location
        run: Get-Command docker

      - name: Wait for Docker to be ready
        shell: powershell
        run: |
            for ($i = 0; $i -lt 30; $i++) {
              if (docker info) {
                Write-Host "Docker is ready."
                break
              }
              Write-Host "Waiting for Docker..."
              Start-Sleep -Seconds 3
            }

      - name: Check Docker version
        run: docker --version

      - name: Pull a Linux image to verify Docker works
        run: |
              docker info
              wsl -l -v          
              docker pull --platform linux alpine:latest

      - name: Run Linux container test
        run: docker run --rm alpine:latest uname -a